<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fondo y Hexágono Base -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2e3d"/>
      <stop offset="100%" stop-color="#071b24"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6ecd2"/>
      <stop offset="50%" stop-color="#e9b84c"/>
      <stop offset="100%" stop-color="#c99a3a"/>
    </linearGradient>

    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a8252"/>
      <stop offset="100%" stop-color="#1b4528"/>
    </linearGradient>

    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6623e"/>
      <stop offset="100%" stop-color="#8a341b"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Marco Circular de Fondo -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#dropShadow)"/>
  
  <!-- Hexágono Principal (Isla de Catan) -->
  <g filter="url(#dropShadow)">
    <polygon points="250,60 390,140 390,300 250,380 110,300 110,140" fill="#2f6d43" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Sub-hexágono interno -->
    <polygon points="250,75 375,148 375,292 250,365 125,292 125,148" fill="none" stroke="#e9b84c" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  </g>

  <!-- Elementos del Juego: Terreno y Dados -->
  <!-- Montañas / Bosque en el Hexágono -->
  <polygon points="180,280 220,200 260,280" fill="url(#woodGrad)"/>
  <polygon points="230,290 280,180 330,290" fill="url(#brickGrad)"/>
  <polygon points="220,200 250,180 280,200 250,230" fill="#e9b84c" opacity="0.3"/>

  <!-- Corona de Victoria -->
  <path d="M200,160 L220,120 L250,140 L280,120 L300,160 Z" fill="url(#goldGrad)" filter="url(#dropShadow)"/>
  <circle cx="200" cy="160" r="5" fill="#fff"/>
  <circle cx="250" cy="140" r="6" fill="#fff"/>
  <circle cx="300" cy="160" r="5" fill="#fff"/>

  <!-- Par de Dados Dorados -->
  <g transform="translate(185, 290)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="55" height="55" rx="10" fill="url(#goldGrad)"/>
    <circle cx="15" cy="15" r="4" fill="#1c1508"/>
    <circle cx="40" cy="40" r="4" fill="#1c1508"/>
    <circle cx="27.5" cy="27.5" r="4" fill="#1c1508"/>
  </g>
  
  <g transform="translate(255, 290)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="55" height="55" rx="10" fill="url(#goldGrad)"/>
    <circle cx="15" cy="15" r="4" fill="#1c1508"/>
    <circle cx="40" cy="15" r="4" fill="#1c1508"/>
    <circle cx="15" cy="40" r="4" fill="#1c1508"/>
    <circle cx="40" cy="40" r="4" fill="#1c1508"/>
  </g>

  <!-- Texto Principal -->
  <text x="250" y="435" text-anchor="middle" font-family="'Fraunces', 'Georgia', serif" font-weight="900" font-size="42" fill="url(#goldGrad)" filter="url(#dropShadow)" letter-spacing="2">
    CATANDEJP
  </text>
  
  <text x="250" y="460" text-anchor="middle" font-family="'Inter', 'Arial', sans-serif" font-size="12" fill="#c9d9de" letter-spacing="4" opacity="0.8">
    EDICIÓN MULTIJUGADOR
  </text>
</svg>
