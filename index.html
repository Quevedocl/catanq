<style>
:root{
  --ink:#1c1508;
  --parchment:#ece0c4;
  --parchment-2:#e2d3ac;
  --sea-1:#0b2e3d;
  --sea-2:#0e3f52;
  --sea-3:#134a5f;
  --gold:#c99a3a;
  --gold-bright:#e9b84c;
  --brick:#b5502f;
  --wood:#2f6d43;
  --wool:#8fae4a;
  --grain:#dcb02f;
  --ore:#7c8896;
  --desert:#d8c68b;
  --panel:#132a35;
  --panel-2:#0e222c;
  --line:rgba(233,216,168,0.14);
  --danger:#c1523f;
  --ok:#5c9c6e;
  --radius:14px;
  --shadow: 0 10px 30px rgba(0,0,0,0.35);

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at 20% -10%, #164358 0%, transparent 55%),
    radial-gradient(ellipse at 100% 110%, #0a2029 0%, transparent 55%),
    linear-gradient(180deg,var(--sea-1),var(--sea-2) 55%, var(--sea-1));

  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
::selection{background:var(--gold-bright);color:var(--ink);}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
.app{max-width:1400px;margin:0 auto;padding:12px;}

/* ---------- LOGO COMPONENT ---------- */
.logo-container{display:inline-flex;align-items:center;gap:12px;user-select:none;}
.logo-icon{filter:drop-shadow(0 6px 12px rgba(0,0,0,0.4)); object-fit:contain;}
.brand-title-wrap{display:flex;flex-direction:column;text-align:left;}
.brand-eyebrow{letter-spacing:.35em;text-transform:uppercase;font-size:11px;color:var(--gold-bright);opacity:.85;margin-bottom:4px;font-weight:600;}
.brand-title{font-size:clamp(36px,7vw,84px);font-weight:900;margin:0 0 6px;line-height:.95;
  background:linear-gradient(180deg,#f6ecd2,var(--gold-bright));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));
}
.brand-title-sm{font-size:18px;font-weight:900;line-height:1;
  background:linear-gradient(180deg,#f6ecd2,var(--gold-bright));-webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ---------- Landing ---------- */
.landing{
  min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;padding:16px;position:relative;
}
.landing::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;
  background-image:radial-gradient(circle,var(--gold-bright) 1px, transparent 1.4px);
  background-size:26px 26px;
}
.brand-sub{color:#c9d9de;opacity:.75;max-width:480px;margin:12px auto 24px;font-size:14px;}
.landing-hexrow{display:flex;gap:6px;margin-bottom:24px;}
.mini-hex{width:28px;height:32px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);animation:bob 3.4s ease-in-out infinite;}
.mini-hex:nth-child(odd){animation-delay:.5s}
.mini-hex:nth-child(1){background:var(--wood)}
.mini-hex:nth-child(2){background:var(--brick)}
.mini-hex:nth-child(3){background:var(--grain)}
.mini-hex:nth-child(4){background:var(--wool)}
.mini-hex:nth-child(5){background:var(--ore)}
.mini-hex:nth-child(6){background:var(--desert)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.landing-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;}
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow); width:100%; max-width:340px;
}
.card h3{margin:0 0 14px;font-size:18px;font-weight:700;color:var(--gold-bright);}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;text-align:left;}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;font-weight:600;}
.field input, .field select{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--parchment);
  padding:10px 12px;font-size:14px;outline:none;transition:border-color .15s;
}
.field input:focus{border-color:var(--gold);}
.color-row{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s;}
.swatch.selected{border-color:#fff;transform:scale(1.12);}
.btn{
  border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#241a06;

}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(201,154,58,.5);}
.btn:active{transform:translateY(0px) scale(.98);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--parchment);box-shadow:none;}
.btn.ghost:hover{border-color:var(--gold);}
.btn.small{width:auto;padding:7px 12px;font-size:12px;}
.btn.danger{background:linear-gradient(180deg,#d97457,var(--danger));color:#2a0f0a;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.error-msg{color:#ff9d85;font-size:12px;margin-top:6px;min-height:16px;}

/* ---------- Lobby ---------- */
.lobby-wrap{max-width:500px;margin:30px auto;padding:0 12px;}
.lobby-code{font-family:'Fraunces',serif;font-size:36px;font-weight:800;letter-spacing:.12em;color:var(--gold-bright);text-align:center;margin:6px 0 2px;}
.players-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.player-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;}

.player-row .name{font-weight:600;font-size:14px;}
.player-row .tag{margin-left:auto;font-size:10px;opacity:.55;text-transform:uppercase;letter-spacing:.05em;}

/* ============================= AUDIO SYNTHESIZER ============================= */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'dice') {
      for (let i = 0; i < 5; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150 + Math.random() * 200, now + i * 0.08);
        gain.gain.setValueAtTime(0.15, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.06);
      }
    } else if (type === 'build') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(440, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'card') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'turn') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'win') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.25, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.3);
      });
    }
  } catch (e) { console.error(e); }
}

window.storage = {
  async get(key) {
    const cleanKey = key.replace(/:/g, '_');
    const snapshot = await db.ref(cleanKey).once('value');
    const val = snapshot.val();
    return val ? { value: typeof val === 'string' ? val : JSON.stringify(val) } : null;
  },
  async set(key, value) {
    const cleanKey = key.replace(/:/g, '_');
    const parsed = typeof value === 'string' ? JSON.parse(value) : value;
    await db.ref(cleanKey).set(parsed);
    return true;
  }
};

function uid(){return Math.random().toString(36).slice(2,10);}
function genCode(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];return s;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cubeDist(a,b){return (Math.abs(a.q-b.q)+Math.abs(a.q+a.r-b.q-b.r)+Math.abs(a.r-b.r))/2;}
function axialToPixel(q,r){return {x:HEX_SIZE*Math.sqrt(3)*(q+r/2), y:HEX_SIZE*1.5*r};}
function hexCorners(cx,cy){const pts=[];for(let i=0;i<6;i++){const ang=Math.PI/180*(60*i-30);pts.push({x:cx+HEX_SIZE*Math.cos(ang), y:cy+HEX_SIZE*Math.sin(ang)});}return pts;}
function vkey(p){return Math.round(p.x*2)+','+Math.round(p.y*2);}
function ekey(a,b){return [a,b].sort().join('|');}
function deepClone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

/* ============================= BOARD GEN ============================= */
function buildBoard(){
  let coords=[];
  for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++){const s=-q-r; if(Math.max(Math.abs(q),Math.abs(r),Math.abs(s))<=2) coords.push({q,r});}
  coords.sort((a,b)=> a.r-b.r || a.q-b.q);
  let terrains, numbers, ok=false, tries=0;
  let hexes;
  while(!ok && tries<80){
    tries++;
    terrains = shuffle(HEX_TERRAIN);
    hexes = coords.map((c,i)=>({id:'h'+i, q:c.q, r:c.r, terrain:terrains[i]}));
    const nonDesert = hexes.filter(h=>h.terrain!=='desert');
    numbers = shuffle(NUMBERS);
    nonDesert.forEach((h,i)=>h.number=numbers[i]);
    hexes.forEach(h=>{ if(h.terrain==='desert') h.number=null; });
    ok=true;
    const hot = hexes.filter(h=>h.number===6||h.number===8);
    outer: for(let i=0;i<hot.length;i++)for(let j=i+1;j<hot.length;j++){
      if(cubeDist(hot[i],hot[j])===1){ok=false;break outer;}
    }
  }
  hexes.forEach(h=>{const p=axialToPixel(h.q,h.r);h.cx=p.x;h.cy=p.y;});
  let desert = hexes.find(h=>h.terrain==='desert');

  const vertices={};
  const edges={};
  hexes.forEach(h=>{
    const corners = hexCorners(h.cx,h.cy);
    h.cornerKeys=[];
    corners.forEach(c=>{
      const k=vkey(c);
      if(!vertices[k]) vertices[k]={id:k,x:c.x,y:c.y,hexes:[]};
      if(!vertices[k].hexes.includes(h.id)) vertices[k].hexes.push(h.id);
      h.cornerKeys.push(k);
    });
    for(let i=0;i<6;i++){
      const a=h.cornerKeys[i], b=h.cornerKeys[(i+1)%6];
      const k=ekey(a,b);
      if(!edges[k]) edges[k]={id:k,a,b,hexes:[]};
      if(!edges[k].hexes.includes(h.id)) edges[k].hexes.push(h.id);
    }
  });

  Object.values(edges).forEach(e=>{
    vertices[e.a].adj = vertices[e.a].adj||[]; if(!vertices[e.a].adj.includes(e.b)) vertices[e.a].adj.push(e.b);
    vertices[e.b].adj = vertices[e.b].adj||[]; if(!vertices[e.b].adj.includes(e.a)) vertices[e.b].adj.push(e.a);
  });

  const boundary = Object.values(edges).filter(e=>e.hexes.length===1);
  const cx=0,cy=0;
  boundary.forEach(e=>{
    const va=vertices[e.a], vb=vertices[e.b];
    e.midAngle = Math.atan2(((va.y+vb.y)/2)-cy, ((va.x+vb.x)/2)-cx);
  });
  boundary.sort((a,b)=>a.midAngle-b.midAngle);
  const portTypes = shuffle(['3:1','3:1','3:1','3:1','wood','brick','wool','grain','ore']);
  const ports=[];
  const step = boundary.length/9;
  for(let i=0;i<9;i++){
    const idx = Math.floor(i*step);
    const e = boundary[idx];
    ports.push({edgeId:e.id, a:e.a, b:e.b, type:portTypes[i]});
  }
  return {hexes, vertices, edges, ports, robberHex: desert.id};
}

/* ============================= GAME LOGIC HELPERS ============================= */
function emptyRes(){return {wood:0,brick:0,wool:0,grain:0,ore:0};}
function resTotal(r){return RES.reduce((s,k)=>s+(r[k]||0),0);}
function canAfford(r,cost){return Object.keys(cost).every(k=>(r[k]||0)>=cost[k]);}
function payCost(r,cost){Object.keys(cost).forEach(k=>r[k]-=cost[k]);}

function vertexHasBuilding(state,vid){
  for(const p of state.players){
    if(p.settlements && p.settlements.includes(vid)) return {playerId:p.id,type:'settlement'};
    if(p.cities && p.cities.includes(vid)) return {playerId:p.id,type:'city'};
  }
  return null;
}
function edgeHasRoad(state,eid){
  for(const p of state.players) if(p.roads && p.roads.includes(eid)) return p.id;
  return null;
}
function playerRoadEdges(state,pid){const p=state.players.find(x=>x.id===pid); return (p.roads||[]).map(eid=>state.board.edges[eid]);}

function vertexTouchesPlayerRoad(state,pid,vid){
  const p = state.players.find(x=>x.id===pid);
  return (p.roads||[]).some(eid=>{const e=state.board.edges[eid];return e.a===vid||e.b===vid;});
}

function legalSetupSettlementSpots(state){
  const v = state.board.vertices;
  return Object.keys(v).filter(vid=>{
    if(vertexHasBuilding(state,vid)) return false;
    const adjOccupied = (v[vid].adj||[]).some(n=>vertexHasBuilding(state,n));
    return !adjOccupied;
  });
}
function legalSettlementSpots(state,pid){
  const v=state.board.vertices;
  const p=state.players.find(x=>x.id===pid);
  if((p.settlements||[]).length >= MAX_PIECES.settlements) return [];
  return Object.keys(v).filter(vid=>{
    if(vertexHasBuilding(state,vid)) return false;
    const adjOccupied=(v[vid].adj||[]).some(n=>vertexHasBuilding(state,n));
    if(adjOccupied) return false;
    return vertexTouchesPlayerRoad(state,pid,vid);
  });
}
function legalCitySpots(state,pid){
  const p=state.players.find(x=>x.id===pid);
  if((p.cities||[]).length >= MAX_PIECES.cities) return [];
  return (p.settlements||[]).slice();
}
function legalRoadSpots(state,pid,fromSetupVertex){
  const e=state.board.edges;
  const p=state.players.find(x=>x.id===pid);
  if(!fromSetupVertex && (p.roads||[]).length >= MAX_PIECES.roads) return [];
  return Object.keys(e).filter(eid=>{
    if(edgeHasRoad(state,eid)) return false;
    const ed=e[eid];
    if(fromSetupVertex) return ed.a===fromSetupVertex||ed.b===fromSetupVertex;
    const touchesRoad = (p.roads||[]).some(rid=>{const r=e[rid]; return r.a===ed.a||r.a===ed.b||r.b===ed.a||r.b===ed.b;});
    const touchesOwnBuilding = [...(p.settlements||[]),...(p.cities||[])].some(vid=>vid===ed.a||vid===ed.b);
    return touchesRoad || touchesOwnBuilding;
  });
}

function longestRoadLength(state,pid){
  const edges = playerRoadEdges(state,pid);
  if(!edges.length) return 0;
  const adj={};
  edges.forEach(e=>{adj[e.a]=adj[e.a]||[];adj[e.a].push(e);adj[e.b]=adj[e.b]||[];adj[e.b].push(e);});
  let best=0;
  function dfs(vertex, usedEdges, len){
    best=Math.max(best,len);
    (adj[vertex]||[]).forEach(e=>{
      if(usedEdges.has(e.id)) return;
      const other = vertex===e.a?e.b:e.a;
      const occ = vertexHasBuilding(state,other);
      if(occ && occ.playerId!==pid){
        usedEdges.add(e.id);
        best=Math.max(best,len+1);
        usedEdges.delete(e.id);
        return;
      }
      usedEdges.add(e.id);
      dfs(other, usedEdges, len+1);
      usedEdges.delete(e.id);
    });
  }
  Object.keys(adj).forEach(v=>dfs(v,new Set(),0));
  return best;
}

function computeLongestRoad(state){
  let holder=state.longestRoadPlayer, lens={};
  state.players.forEach(p=>{lens[p.id]=longestRoadLength(state,p.id);});
  let bestP=null,bestLen=0;
  state.players.forEach(p=>{if(lens[p.id]>bestLen){bestLen=lens[p.id];bestP=p.id;}});
  if(bestLen>=5){
    if(!holder || lens[holder]<bestLen || holder===bestP){ state.longestRoadPlayer=bestP; }
    else if(lens[holder]<5){ state.longestRoadPlayer=bestP; }
  } else {
    state.longestRoadPlayer=null;
  }
}
function computeLargestArmy(state){
  let bestP=null,bestN=2;
  state.players.forEach(p=>{if((p.knightsPlayed||0)>bestN){bestN=p.knightsPlayed;bestP=p.id;}});
  if(bestP) state.largestArmyPlayer=bestP;
}
function playerVPPublic(state,p){
  let vp = (p.settlements||[]).length*1 + (p.cities||[]).length*2;
  if(state.longestRoadPlayer===p.id) vp+=2;
  if(state.largestArmyPlayer===p.id) vp+=2;
  return vp;
}
function playerVPTotal(state,p){
  let vp = playerVPPublic(state,p);
  vp += (p.devCards||[]).filter(c=>c.type==='vp').length;
  return vp;
}

function hexResource(terrain){ return terrain==='desert'?null:terrain; }

function distributeForRoll(state, roll){
  const gains={}; state.players.forEach(p=>gains[p.id]=emptyRes());
  state.board.hexes.forEach(h=>{
    if(h.number!==roll) return;
    if(h.id===state.board.robberHex) return;
    const res = hexResource(h.terrain);
    if(!res) return;
    h.cornerKeys.forEach(vid=>{
      const occ = vertexHasBuilding(state,vid);
      if(!occ) return;
      const amt = occ.type==='city'?2:1;
      gains[occ.playerId][res]+=amt;
    });
  });
  state.players.forEach(p=>{RES.forEach(r=>p.resources[r]+=gains[p.id][r]);});
  return gains;
}

function portsForPlayer(state,pid){
  const p=state.players.find(x=>x.id===pid);
  const owned = [...(p.settlements||[]),...(p.cities||[])];
  const types=new Set();
  state.board.ports.forEach(port=>{
    if(owned.includes(port.a)||owned.includes(port.b)) types.add(port.type);
  });
  return types;
}
function bestRate(state,pid,resource){
  const types = portsForPlayer(state,pid);
  if(types.has(resource)) return 2;
  if(types.has('3:1')) return 3;
  return 4;
}

function renderBoardSVG(){
  if(!STATE.board || !STATE.board.hexes) return '';
  const hexes = STATE.board.hexes, vertices=STATE.board.vertices, edges=STATE.board.edges;
  const xs=hexes.map(h=>h.cx), ys=hexes.map(h=>h.cy);
  const minX=Math.min(...xs)-HEX_SIZE*1.8, maxX=Math.max(...xs)+HEX_SIZE*1.8;
  const minY=Math.min(...ys)-HEX_SIZE*1.8, maxY=Math.max(...ys)+HEX_SIZE*1.8;
  const w=maxX-minX, h=maxY-minY;

  let hexSvg = hexes.map(hx=>{
    const pts = hexCorners(hx.cx,hx.cy).map(p=>`${p.x},${p.y}`).join(' ');
    const isRobbed = STATE.board.robberHex===hx.id;
    const canClickRobber = STATE.pendingRobberMove && STATE.players[STATE.turnOrder?STATE.turnOrder[STATE.turnIndex]:STATE.turnIndex].id===ME.id && !isRobbed;
    let numTok='';
    if(hx.number){
      const hot = hx.number===6||hx.number===8;
      numTok = `<g class="num-token ${hot?'hot':''}" transform="translate(${hx.cx},${hx.cy})"><circle r="17"/><text x="0" y="6" text-anchor="middle" font-size="17">${hx.number}</text></g>`;
    }
    return `<g class="hex-tile ${isRobbed?'robbed':''}" data-robber-hex="${canClickRobber?hx.id:''}" style="${canClickRobber?'cursor:pointer':''}">
      <polygon points="${pts}" fill="${HEX_FILL[hx.terrain]}" stroke="#0e2029" stroke-width="2"/>
      ${numTok}
      ${isRobbed?`<text x="${hx.cx}" y="${hx.cy+34}" text-anchor="middle" font-size="22" class="robber-icon">🥷</text>`:''}
    </g>`;
  }).join('');

  let portSvg = STATE.board.ports.map(port=>{
    const va=vertices[port.a], vb=vertices[port.b];
    const mx=(va.x+vb.x)/2, my=(va.y+vb.y)/2;
    const dx = mx - 0, dy = my - 0;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const ox = mx + dx/dist*26, oy = my + dy/dist*26;
    const label = port.type==='3:1'?'3:1':'2:1';
    const icon = port.type==='3:1'?'⚓':RES_ICON[port.type];
    return `<g class="port-badge">
      <line x1="${va.x}" y1="${va.y}" x2="${ox}" y2="${oy}" stroke="#f3e6c4" stroke-width="2" stroke-dasharray="3,2"/>
      <line x1="${vb.x}" y1="${vb.y}" x2="${ox}" y2="${oy}" stroke="#f3e6c4" stroke-width="2" stroke-dasharray="3,2"/>
      <circle cx="${ox}" cy="${oy}" r="15" fill="${port.type==='3:1'?'#3f6f80':HEX_FILL[port.type]}"/>
      <text x="${ox}" y="${oy-1}" text-anchor="middle" font-size="11">${icon}</text>
      <text x="${ox}" y="${oy+11}" text-anchor="middle" font-size="8">${label}</text>
      </g>`;
  }).join('');

  let roadSvg = STATE.players.map(p=>(p.roads||[]).map(eid=>{
    const e=edges[eid]; const va=vertices[e.a], vb=vertices[e.b];
    return `<line class="road-line" x1="${va.x}" y1="${va.y}" x2="${vb.x}" y2="${vb.y}" stroke="${p.color}" stroke-width="7"/>`;
  }).join('')).join('');

  let ghostRoads='', ghostVerts='';
  const clickCtx = getClickContext();
  if(clickCtx.roadSpots){
    ghostRoads = clickCtx.roadSpots.map(eid=>{
      const e=edges[eid]; const va=vertices[e.a], vb=vertices[e.b];
      return `<line class="espot" data-road="${eid}" x1="${va.x}" y1="${va.y}" x2="${vb.x}" y2="${vb.y}"/>`;
    }).join('');
  }
  if(clickCtx.vertexSpots){
    ghostVerts = clickCtx.vertexSpots.map(vid=>{
      const v=vertices[vid];
      return `<circle class="vspot" data-vertex="${vid}" cx="${v.x}" cy="${v.y}" r="14"/>`;
    }).join('');
  }

  let buildSvg = STATE.players.map(p=>{
    let s = (p.settlements||[]).map(vid=>{
      const v=vertices[vid];
      return `<g class="building"><polygon points="${v.x-8},${v.y+7} ${v.x-8},${v.y-2} ${v.x},${v.y-10} ${v.x+8},${v.y-2} ${v.x+8},${v.y+7}" fill="${p.color}" stroke="#1c1508" stroke-width="1.5"/></g>`;
    }).join('');
    let c = (p.cities||[]).map(vid=>{
      const v=vertices[vid];
      return `<g class="building"><rect x="${v.x-11}" y="${v.y-3}" width="22" height="13" fill="${p.color}" stroke="#1c1508" stroke-width="1.5"/><polygon points="${v.x-11},${v.y-3} ${v.x-4},${v.y-13} ${v.x+3},${v.y-3}" fill="${p.color}" stroke="#1c1508" stroke-width="1.5"/></g>`;
    }).join('');
    return s+c;
  }).join('');

  return `<svg id="board" viewBox="${minX} ${minY} ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <g>${hexSvg}</g>
    <g>${portSvg}</g>
    <g>${roadSvg}</g>
    <g>${buildSvg}</g>
    <g>${ghostRoads}</g>
    <g>${ghostVerts}</g>
  </svg>`;
}

function getClickContext(){
  if(!STATE) return {};
  const activeP = STATE.players[STATE.turnOrder ? STATE.turnOrder[STATE.turnIndex] : STATE.turnIndex];
  const isMyTurn = activeP && activeP.id===ME.id;
  if(STATE.phase==='setup' && isMyTurn){
    if(STATE.setupSubPhase==='settlement') return {vertexSpots: legalSetupSettlementSpots(STATE)};
    if(STATE.setupSubPhase==='road') return {roadSpots: legalRoadSpots(STATE, ME.id, STATE.lastSetupVertex)};
  }
  if(STATE.phase==='play' && isMyTurn && !Object.keys(STATE.pendingDiscards||{}).length){
    if(modal && modal.type==='buildRoad') return {roadSpots: legalRoadSpots(STATE, ME.id)};
    if(modal && modal.type==='buildSettlement') return {vertexSpots: legalSettlementSpots(STATE,ME.id)};
    if(modal && modal.type==='buildCity') return {vertexSpots: legalCitySpots(STATE,ME.id)};
    if(modal && modal.type==='roadBuildingCard') return {roadSpots: legalRoadSpots(STATE, ME.id)};
  }
  return {};
}

/* ---------------- MODALS ---------------- */
function renderModal(){
  const me = STATE.players.find(p=>p.id===ME.id);
  
  // Modales de construcción no bloqueantes (permiten hacer clic directamente en el tablero)
  if(modal.type==='buildRoad') return wrapModal('Construir camino','<p class="help">Haz clic directamente sobre un tramo resaltado del tablero.</p>', true);
  if(modal.type==='buildSettlement') return wrapModal('Construir poblado','<p class="help">Haz clic directamente sobre un punto resaltado del tablero.</p>', true);
  if(modal.type==='buildCity') return wrapModal('Construir ciudad','<p class="help">Haz clic en uno de tus poblados para mejorarlo.</p>', true);
  
  if(modal.type==='discard'){
    const need = STATE.pendingDiscards[ME.id];
    const cur = modal.picks || emptyRes();
    const picked = resTotal(cur);
    return wrapModal(`Descarta ${need} cartas`, `
      <div class="res-picker">${RES.map(r=>`<div class="res-line"><span class="lbl">${RES_ICON[r]} ${RES_ES[r]} (${me.resources[r]})</span>
      <div class="stepper"><button data-disc-dec="${r}">-</button><span class="val">${cur[r]}</span><button data-disc-inc="${r}">+</button></div></div>`).join('')}</div>
      <p class="help">Seleccionadas: ${picked} / ${need}</p>
      <button class="btn" id="btnConfirmDiscard" ${picked===need?'':'disabled'}>Confirmar descarte</button>
    `);
  }
  if(modal.type==='bankTrade'){
    const give = modal.give || RES[0];
    const rate = bestRate(STATE,ME.id,give);
    const get = modal.get || RES.find(r=>r!==give);
    return wrapModal('Cambio con el banco', `
      <div class="field"><label>Entregas (tasa ${rate}:1)</label><select id="selGive">${RES.map(r=>`<option value="${r}" ${r===give?'selected':''}>${RES_ICON[r]} ${RES_ES[r]} — tienes ${me.resources[r]}</option>`).join('')}</select></div>
      <div class="field"><label>Recibes</label><select id="selGet">${RES.map(r=>`<option value="${r}" ${r===get?'selected':''}>${RES_ICON[r]} ${RES_ES[r]}</option>`).join('')}</select></div>
      <button class="btn" id="btnConfirmBankTrade" ${me.resources[give]>=rate?'':'disabled'}>Cambiar ${rate} ${RES_ICON[give]} por 1 ${RES_ICON[get]}</button>
    `);
  }
  if(modal.type==='offerTrade'){
    const offer = modal.offer||emptyRes(), request=modal.request||emptyRes();
    return wrapModal('Proponer trueque', `
      <p class="help">Ofreces:</p>
      <div class="res-picker">${RES.map(r=>`<div class="res-line"><span class="lbl">${RES_ICON[r]} ${RES_ES[r]}</span><div class="stepper"><button data-off-dec="${r}">-</button><span class="val">${offer[r]}</span><button data-off-inc="${r}">+</button></div></div>`).join('')}</div>
      <p class="help">Pides a cambio:</p>
      <div class="res-picker">${RES.map(r=>`<div class="res-line"><span class="lbl">${RES_ICON[r]} ${RES_ES[r]}</span><div class="stepper"><button data-req-dec="${r}">-</button><span class="val">${request[r]}</span><button data-req-inc="${r}">+</button></div></div>`).join('')}</div>
      <button class="btn" id="btnSendTrade">Enviar propuesta</button>
    `);
  }
  if(modal.type==='devPlay'){
    return wrapModal(DEV_NAMES[modal.devType], modal.devBody||'');
  }
  return '';
}

function wrapModal(title, body, nonBlocking = false){
  return `<div class="overlay ${nonBlocking?'non-blocking':''}" id="overlayClose"><div class="modal" onclick="event.stopPropagation()">
    <button class="btn ghost small modal-close" id="btnCloseModal">✕</button>
    <h3>${esc(title)}</h3>
    ${body}
  </div></div>`;
}

/* ============================= ACTIONS ============================= */
async function withState(fn){
  const fresh = await sGet(gameKey(GAME_CODE), true);
  if(fresh) STATE = fresh;
  const s = deepClone(STATE);
  const res = fn(s);
  if(res===false) return;
  STATE = s;
  await sSet(gameKey(GAME_CODE), s, true);
  if(STATE.phase !== 'lobby' && VIEW === 'lobby'){
    VIEW = 'game';
  }
  render();
}
function log(state,msg){ state.log = state.log||[]; state.log.push(msg); }

async function doCreate(){
  if(!createName.trim()){ q('#createErr').textContent='Ingresa tu nombre.'; return; }
  const code = genCode();
  const me = {id:uid(), name:createName.trim(), color:createColor};
  const state = {
    code, hostId: me.id, phase:'lobby',
    players:[playerObj(me)],
    board:null, turnIndex:0, turnOrder:null, diceLast:null, log:[`${me.name} creó la sala.`],
    tradeOffer:null, setupSubPhase:null, lastSetupVertex:null,
    pendingDiscards:{}, pendingRobberMove:false, rolledThisTurn:false, devCardPlayedThisTurn:false,
    devDeck: shuffle(DEV_DECK), longestRoadPlayer:null, largestArmyPlayer:null, winner:null,
    updatedAt: Date.now()
  };
  ME = me; GAME_CODE = code;
  await sSet(meKey(code), me, false);
  await sSet(gameKey(code), state, true);
  STATE = state; VIEW='lobby';
  startRealtimeListener();
  render();
}
function playerObj(me){
  return {id:me.id,name:me.name,color:me.color,resources:emptyRes(),devCards:[],knightsPlayed:0,roads:[],settlements:[],cities:[]};
}
async function doJoin(){
  const code = joinCode.trim().toUpperCase();
  if(!code || code.length<4){ q('#joinErr').textContent='Ingresa un código válido.'; return; }
  if(!joinName.trim()){ q('#joinErr').textContent='Ingresa tu nombre.'; return; }
  const state = await sGet(gameKey(code), true);
  if(!state){ q('#joinErr').textContent='No se encontró esa sala.'; return; }
  if(state.phase!=='lobby'){ q('#joinErr').textContent='Esa partida ya comenzó.'; return; }
  if(state.players.length>=4){ q('#joinErr').textContent='La sala está llena.'; return; }
  const me = {id:uid(), name:joinName.trim(), color:joinColor};
  const usedColors = state.players.map(p=>p.color);
  if(usedColors.includes(me.color)){ me.color = COLORS.find(c=>!usedColors.includes(c)) || me.color; }
  state.players.push(playerObj(me));
  log(state, `${me.name} se unió a la sala.`);
  await sSet(meKey(code), me, false);
  await sSet(gameKey(code), state, true);
  ME=me; GAME_CODE=code; STATE=state; VIEW='lobby';
  startRealtimeListener();
  render();
}
async function doStart(){
  await withState(s=>{
    s.board = buildBoard();
    s.phase='setup';
    const order = s.players.map((p,i)=>i);
    s.turnOrder = [...order, ...[...order].reverse()];
    s.turnIndex=0;
    s.setupSubPhase='settlement';
    log(s,'¡La partida ha comenzado! Fase de colocación inicial.');
  });
  VIEW = 'game';
  render();
}

async function onVertexClick(vid){
  if(!STATE) return;
  const activeP = STATE.players[STATE.turnOrder ? STATE.turnOrder[STATE.turnIndex]: STATE.turnIndex];
  if(!activeP || activeP.id!==ME.id) return;
  if(STATE.phase==='setup' && STATE.setupSubPhase==='settlement'){
    await withState(s=>{
      const p = s.players.find(x=>x.id===ME.id);
      p.settlements = p.settlements || [];
      p.settlements.push(vid);
      s.lastSetupVertex = vid;
      s.setupSubPhase='road';
      log(s, `${p.name} colocó un poblado inicial.`);
    });
    playSound('build');
    return;
  }
  if(STATE.phase==='play' && modal && modal.type==='buildSettlement'){
    await withState(s=>{
      const p=s.players.find(x=>x.id===ME.id);
      p.settlements = p.settlements || [];
      if(!canAfford(p.resources,COST.settlement)) return false;
      if(p.settlements.length >= MAX_PIECES.settlements) return false;
      payCost(p.resources,COST.settlement);
      p.settlements.push(vid);
      computeLongestRoad(s);
      log(s,`${p.name} construyó un poblado.`);
      checkWin(s);
    });
    playSound('build');
    modal=null;
    return;
  }
  if(STATE.phase==='play' && modal && modal.type==='buildCity'){
    await withState(s=>{
      const p=s.players.find(x=>x.id===ME.id);
      p.settlements = p.settlements || [];
      p.cities = p.cities || [];
      if(!p.settlements.includes(vid)) return false;
      if(!canAfford(p.resources,COST.city)) return false;
      if(p.cities.length >= MAX_PIECES.cities) return false;
      payCost(p.resources,COST.city);
      p.settlements = p.settlements.filter(v=>v!==vid);
      p.cities.push(vid);
      log(s,`${p.name} mejoró un poblado a ciudad.`);
      checkWin(s);
    });
    playSound('build');
    modal=null;
    return;
  }
}
async function onRoadClick(eid){
  if(!STATE) return;
  const activeP = STATE.players[STATE.turnOrder ? STATE.turnOrder[STATE.turnIndex]: STATE.turnIndex];
  if(!activeP || activeP.id!==ME.id) return;
  if(STATE.phase==='setup' && STATE.setupSubPhase==='road'){
    await withState(s=>{
      const p=s.players.find(x=>x.id===ME.id);
      p.roads = p.roads || [];
      p.roads.push(eid);
      log(s,`${p.name} colocó un camino inicial.`);
      const roundTwo = s.turnIndex >= s.players.length;
      if(roundTwo){
        const lastVid = s.lastSetupVertex;
        const vObj = s.board.vertices[lastVid];
        vObj.hexes.forEach(hid=>{
          const hx = s.board.hexes.find(h=>h.id===hid);
          const res = hexResource(hx.terrain);
          if(res) p.resources[res]=(p.resources[res]||0)+1;
        });
      }
      s.lastSetupVertex=null;
      s.turnIndex++;
      if(s.turnIndex>=s.turnOrder.length){
        s.phase='play';
        s.turnIndex=0;
        s.rolledThisTurn=false;
        log(s,'Colocación inicial terminada. ¡Comienza el juego!');
      } else {
        s.setupSubPhase='settlement';
      }
    });
    playSound('build');
    return;
  }
  if(STATE.phase==='play' && modal && (modal.type==='buildRoad'||modal.type==='roadBuildingCard')){
    await withState(s=>{
      const p=s.players.find(x=>x.id===ME.id);
      p.roads = p.roads || [];
      if(modal.type==='buildRoad'){
        if(!canAfford(p.resources,COST.road) || p.roads.length >= MAX_PIECES.roads) return false;
        payCost(p.resources,COST.road);
      } else {
        if(p.roads.length >= MAX_PIECES.roads) return false;
        modal.roadsLeft = (modal.roadsLeft==null?2:modal.roadsLeft)-1;
      }
      p.roads.push(eid);
      computeLongestRoad(s);
      log(s,`${p.name} construyó un camino.`);
      checkWin(s);
    });
    playSound('build');
    if(modal && modal.type==='roadBuildingCard'){
      if(modal.roadsLeft<=0){ modal=null; }
    } else modal=null;
    return;
  }
}
async function onRobberHexClick(hid){
  await withState(s=>{
    const activeP = s.players[s.turnOrder?s.turnOrder[s.turnIndex]:s.turnIndex];
    if(activeP.id!==ME.id || !s.pendingRobberMove) return false;
    s.board.robberHex = hid;
    const hx = s.board.hexes.find(h=>h.id===hid);
    const victims = new Set();
    hx.cornerKeys.forEach(vid=>{
      const occ = vertexHasBuilding(s,vid);
      if(occ && occ.playerId!==activeP.id) victims.add(occ.playerId);
    });
    const victimList = [...victims];
    if(victimList.length){
      const vId = victimList[Math.floor(Math.random()*victimList.length)];
      const victim = s.players.find(p=>p.id===vId);
      const pool=[]; RES.forEach(r=>{for(let i=0;i<(victim.resources[r]||0);i++)pool.push(r);});
      if(pool.length){
        const stolen = pool[Math.floor(Math.random()*pool.length)];
        victim.resources[stolen]--;
        activeP.resources[stolen]=(activeP.resources[stolen]||0)+1;
        log(s,`${activeP.name} robó una carta a ${victim.name}.`);
      } else {
        log(s,`${activeP.name} movió al ladrón (nadie tenía cartas).`);
      }
    } else {
      log(s,`${activeP.name} movió al ladrón.`);
    }
    s.pendingRobberMove=false;
  });
}

async function doRoll(){
  ROLLING=true; render();
  playSound('dice');
  await new Promise(r=>setTimeout(r,480));
  await withState(s=>{
    const activeP = s.players[s.turnOrder?s.turnOrder[s.turnIndex]:s.turnIndex];
    if(activeP.id!==ME.id || s.rolledThisTurn) return false;
    const d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6);
    s.diceLast=[d1,d2];
    s.rolledThisTurn=true;
    const roll=d1+d2;
    log(s,`${activeP.name} tiró los dados: ${d1} + ${d2} = ${roll}`);
    if(roll===7){
      s.pendingDiscards={};
      s.players.forEach(p=>{
        const tot=resTotal(p.resources);
        if(tot>7) s.pendingDiscards[p.id]=Math.floor(tot/2);
      });
      if(Object.keys(s.pendingDiscards).length===0){
        s.pendingRobberMove=true;
      }
    } else {
      distributeForRoll(s, roll);
    }
  });
  ROLLING=false;
}
async function doEndTurn(){
  await withState(s=>{
    const activeP = s.players[s.turnOrder?s.turnOrder[s.turnIndex]:s.turnIndex];
    if(activeP.id!==ME.id) return false;
    checkWin(s);
    if(s.phase==='end') return;
    s.turnIndex = (s.turnIndex+1) % s.players.length;
    s.rolledThisTurn=false;
    s.devCardPlayedThisTurn=false;
    s.players.forEach(p=>(p.devCards||[]).forEach(c=>c.boughtThisTurn=false));
    log(s,`Turno de ${s.players[s.turnIndex].name}.`);
  });
  modal=null;
}
async function doBuyDev(){
  await withState(s=>{
    const p=s.players.find(x=>x.id===ME.id);
    if(!canAfford(p.resources,COST.dev) || (s.devDeck||[]).length===0) return false;
    payCost(p.resources,COST.dev);
    const type = s.devDeck.pop();
    p.devCards = p.devCards || [];
    p.devCards.push({type,played:false,boughtThisTurn:true});
    log(s,`${p.name} compró una carta de desarrollo.`);
    checkWin(s);
  });
  playSound('card');
}
async function doDiscard(){
  const need = STATE.pendingDiscards[ME.id];
  const picks = modal.picks||emptyRes();
  if(resTotal(picks)!==need) return;
  await withState(s=>{
    const p=s.players.find(x=>x.id===ME.id);
    RES.forEach(r=>p.resources[r]-=(picks[r]||0));
    delete s.pendingDiscards[ME.id];
    log(s,`${p.name} descartó ${need} cartas.`);
    if(Object.keys(s.pendingDiscards).length===0){
      s.pendingRobberMove=true;
    }
  });
  modal=null;
}
async function doBankTrade(){
  const give = modal.give||RES[0], get=modal.get||RES.find(r=>r!==give);
  await withState(s=>{
    const p=s.players.find(x=>x.id===ME.id);
    const rate = bestRate(s,ME.id,give);
    if((p.resources[give]||0)<rate) return false;
    p.resources[give]-=rate;
    p.resources[get]=(p.resources[get]||0)+1;
    log(s,`${p.name} cambió ${rate} ${RES_ES[give]} por 1 ${RES_ES[get]} en el banco.`);
  });
  modal=null;
}
async function doSendTrade(){
  const offer=modal.offer||emptyRes(), request=modal.request||emptyRes();
  if(resTotal(offer)===0 && resTotal(request)===0) return;
  await withState(s=>{
    const p=s.players.find(x=>x.id===ME.id);
    if(!canAfford(p.resources,offer)) return false;
    const responses={}; s.players.forEach(pl=>{if(pl.id!==ME.id) responses[pl.id]=null;});
    s.tradeOffer = {fromPlayerId:ME.id, offer, request, responses};
    log(s,`${p.name} propuso un trueque.`);
  });
  modal=null;
}
async function respondTrade(resp){
  await withState(s=>{
    if(!s.tradeOffer) return false;
    s.tradeOffer.responses = s.tradeOffer.responses || {};
    s.tradeOffer.responses[ME.id]=resp;
  });
}
async function doConfirmTrade(otherId){
  await withState(s=>{
    if(!s.tradeOffer || s.tradeOffer.fromPlayerId!==ME.id) return false;
    const from = s.players.find(p=>p.id===ME.id);
    const to = s.players.find(p=>p.id===otherId);
    if(!canAfford(from.resources,s.tradeOffer.offer) || !canAfford(to.resources,s.tradeOffer.request)) return false;
    RES.forEach(r=>{ 
      from.resources[r]-=s.tradeOffer.offer[r]; 
      to.resources[r]+=(s.tradeOffer.offer[r]||0); 
      to.resources[r]-=s.tradeOffer.request[r]; 
      from.resources[r]+=(s.tradeOffer.request[r]||0); 
    });
    log(s,`${from.name} y ${to.name} cerraron un trueque.`);
    s.tradeOffer=null;
  });
}
async function doCancelTrade(){
  await withState(s=>{ s.tradeOffer=null; });
}
async function doPlayDev(idx){
  const me = STATE.players.find(p=>p.id===ME.id);
  const card = me.devCards[idx];
  if(!card || card.type==='vp' || card.played || card.boughtThisTurn) return;
  if(card.type==='knight'){
    await withState(s=>{
      const p=s.players.find(x=>x.id===ME.id);
      p.devCards[idx].played=true;
      p.knightsPlayed=(p.knightsPlayed||0)+1;
      s.devCardPlayedThisTurn=true;
      s.pendingRobberMove=true;
      computeLargestArmy(s);
      log(s,`${p.name} jugó un Caballero.`);
      checkWin(s);
    });
    playSound('card');
    return;
  }
  if(card.type==='roadbuild'){
    await withState(s=>{
      const p=s.players.find(x=>x.id===ME.id);
      p.devCards[idx].played=true;
      s.devCardPlayedThisTurn=true;
      log(s,`${p.name} jugó Construcción de Caminos.`);
    });
    playSound('card');
    modal={type:'roadBuildingCard', roadsLeft:2, devBody:'<p class="help">Coloca hasta 2 caminos gratis en el tablero.</p>'};
    render();
    return;
  }
  if(card.type==='yearplenty'){
    modal={type:'devPlay', devType:'yearplenty', devIdx:idx, picks:emptyRes(), devBody: yearPlentyBody()};
    render();
    return;
  }
  if(card.type==='monopoly'){
    modal={type:'devPlay', devType:'monopoly', devIdx:idx, devBody: monopolyBody()};
    render();
    return;
  }
}
function yearPlentyBody(){
  const cur = modal&&modal.picks||emptyRes();
  return `<p class="help">Elige 2 recursos para recibir del banco.</p>
  <div class="res-picker">${RES.map(r=>`<div class="res-line"><span class="lbl">${RES_ICON[r]} ${RES_ES[r]}</span><div class="stepper"><button data-yp-dec="${r}">-</button><span class="val">${cur[r]}</span><button data-yp-inc="${r}">+</button></div></div>`).join('')}</div>
  <button class="btn" id="btnConfirmYP" ${resTotal(cur)===2?'':'disabled'}>Confirmar</button>`;
}
function monopolyBody(){
  return `<p class="help">Elige un recurso: todos los demás jugadores te entregan todas sus cartas de ese tipo.</p>
  <div class="res-picker">${RES.map(r=>`<button class="btn ghost small" data-mono-pick="${r}" style="margin-bottom:6px;">${RES_ICON[r]} ${RES_ES[r]}</button>`).join('')}</div>`;
}

async function doYearPlenty(){
  const picks = modal.picks; const idx=modal.devIdx;
  await withState(s=>{
    const p=s.players.find(x=>x.id===ME.id);
    p.devCards[idx].played=true;
    s.devCardPlayedThisTurn=true;
    RES.forEach(r=>p.resources[r]=(p.resources[r]||0)+(picks[r]||0));
    log(s,`${p.name} jugó Año de Bonanza y recibió ${RES.filter(r=>picks[r]>0).map(r=>`${picks[r]}${RES_ICON[r]}`).join(' ')}.`);
  });
  playSound('card');
  modal=null;
}
async function doMonopoly(resType){
  const idx=modal.devIdx;
  await withState(s=>{
    const p=s.players.find(x=>x.id===ME.id);
    p.devCards[idx].played=true;
    s.devCardPlayedThisTurn=true;
    let total=0;
    s.players.forEach(op=>{ if(op.id!==p.id){ total+=(op.resources[resType]||0); op.resources[resType]=0; } });
    p.resources[resType]=(p.resources[resType]||0)+total;
    log(s,`${p.name} jugó Monopolio sobre ${RES_ES[resType]} y obtuvo ${total} cartas.`);
  });
  playSound('card');
  modal=null;
}
function checkWin(s){
  const w = s.players.find(p=>playerVPTotal(s,p)>=10);
  if(w){ 
    s.phase='end'; 
    s.winner=w.id; 
    log(s,`🏆 ${w.name} alcanzó 10 puntos de victoria y gana la partida.`);
  }
}

/* ============================= REALTIME LISTENER ============================= */
function startRealtimeListener(){
  stopRealtimeListener();
  if(!GAME_CODE) return;
  const cleanKey = gameKey(GAME_CODE).replace(/:/g, '_');
  FB_REF = db.ref(cleanKey);
  FB_REF.on('value', (snapshot)=>{
    const fresh = snapshot.val();
    if(fresh){
      const nextState = typeof fresh === 'string' ? JSON.parse(fresh) : fresh;
      
      if (STATE && ME) {
        if (nextState.turnIndex !== lastTurnIndex) {
          const activeP = nextState.players[nextState.turnOrder ? nextState.turnOrder[nextState.turnIndex] : nextState.turnIndex];
          if (activeP && activeP.id === ME.id) {
            playSound('turn');
          }
        }
        if (nextState.phase === 'end' && STATE.phase !== 'end') {
          playSound('win');
        }
      }

      STATE = nextState;
      lastTurnIndex = STATE.turnIndex;

      if(STATE.phase !== 'lobby' && VIEW === 'lobby'){ 
        VIEW = 'game'; 
      }
      render();
    }
  });
}
function stopRealtimeListener(){
  if(FB_REF){
    FB_REF.off();
    FB_REF = null;
  }
}

/* ============================= INIT ============================= */
render();
</script>
